name: Preview PDF

# En cada push a main, reconstruye el PDF de la guía (pandoc + tectonic) y refresca una
# única PRE-RELEASE rodante etiquetada `preview` con el PDF + SHA256SUMS recién generados.
# NO es una release versionada: las versiones (p. ej. v1.0) se publican a mano (ver AGENTS.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview-pdf
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # Fijadas para reproducir el toolchain local del autor.
      PANDOC_VERSION: "3.9.0.2"
      TECTONIC_VERSION: "0.16.9"
      PREVIEW_TAG: preview
    steps:
      - uses: actions/checkout@v4

      - name: Cache de paquetes de tectonic
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}

      - name: Instalar ImageMagick (reescalado de imágenes a 300 dpi/JPEG para el PDF)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Instalar pandoc y tectonic (versiones fijadas)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          curl -fsSL -o /tmp/tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/tectonic.tar.gz -C /tmp
          sudo install -m 0755 /tmp/tectonic /usr/local/bin/tectonic
          echo "pandoc:   $(pandoc --version | head -1)"
          echo "tectonic: $(tectonic --version)"

      - name: Construir el PDF y el DOCX
        run: bash generar-pdf.sh

      - name: Escribir SHA256SUMS
        run: cd pdf && shasum -a 256 *.pdf > SHA256SUMS

      - name: Refrescar la pre-release rodante `preview`
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "**Vista previa rodante** — PDF construido automáticamente desde el último push a \`main\`."
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:12}\`"
            echo "- Construido (UTC): $(date -u '+%Y-%m-%d %H:%M')"
            echo ""
            echo "NO es una versión etiquetada; las releases versionadas se publican a mano."
            echo "Verifica la integridad con el \`SHA256SUMS\` adjunto."
          } > "$NOTES"
          gh release delete "$PREVIEW_TAG" --yes --cleanup-tag || true
          sleep 3
          gh release create "$PREVIEW_TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Preview — última build de main" \
            --notes-file "$NOTES" \
            pdf/*.pdf pdf/SHA256SUMS
